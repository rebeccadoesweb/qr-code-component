<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="Frontend Mentor - QR code component">
  <meta name="keywords" content="HTML, CSS">
  <meta name="author" content="Rebecca Padgett">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
  <!-- !css -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <main class="card">
    <img class="card-img" src="./assets/images/image-qr-code.png" width="576" height="576"
      alt="qr code to Frontend Mentor website">
    <div class="card-content">
      <h1 class="card-title">Improve your front-end skills by building projects</h1>
      <p class="card-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
        level</p>
    </div>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.github.com/rebeccadoesweb">Rebecca Padgett</a>.
  </footer>
</body>

</html>
